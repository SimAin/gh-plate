[project]
name = "plate"
dynamic = ["version"]
description = "Terminal status table for open GitHub issues assigned to you."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
plate = "plate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: __version__ in the package __init__.
[tool.hatch.version]
path = "src/plate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/plate"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
