name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialise: two quick main pushes must not race against the same release PR.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
